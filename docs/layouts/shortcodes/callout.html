{{ $type := .Get "type" | default "info" }}
<div class="callout callout-{{ $type }}">
  <div class="callout-icon">
    {{ if eq $type "info" }}
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="7.5"/><path d="M9 8v5M9 5.5v.01"/></svg>
    {{ else if eq $type "warning" }}
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 1.5L1 16h16L9 1.5zM9 7v4M9 13v.01"/></svg>
    {{ else if eq $type "tip" }}
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 1a5 5 0 0 1 3 9v2H6v-2a5 5 0 0 1 3-9zM6.5 14h5M7 16h4"/></svg>
    {{ else if eq $type "danger" }}
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="9" r="7.5"/><path d="M6 6l6 6M12 6l-6 6"/></svg>
    {{ end }}
  </div>
  <div class="callout-content">
    {{ .Inner | markdownify }}
  </div>
</div>
