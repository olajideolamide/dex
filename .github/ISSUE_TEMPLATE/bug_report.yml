name: Bug report
description: Report a bug or unexpected behavior in DEX
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include as much detail as you can.
        If you're reporting a security issue, stop here and use `SECURITY.md` instead.

  - type: input
    id: dex_version
    attributes:
      label: DEX version
      description: The package version you have installed (e.g. 1.2.3)
      placeholder: 0.0.0
    validations:
      required: true

  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: 8.2.x
    validations:
      required: true

  - type: input
    id: ci_version
    attributes:
      label: CodeIgniter version
      placeholder: 4.6.x
    validations:
      required: true

  - type: dropdown
    id: installation_type
    attributes:
      label: Where does the issue happen?
      options:
        - DEX UI (dashboard)
        - Telemetry capture/storage
        - Both / not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short description of the problem
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A clear, minimal set of steps to reproduce the issue
      placeholder: |
        1. Configure DEX with ...
        2. Visit route ...
        3. Trigger ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      description: Paste relevant logs. Please redact secrets and PII.
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Include only the relevant parts. Redact secrets.
      render: yaml
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and discussions
          required: true
        - label: This is not a security report (I reviewed SECURITY.md)
          required: true

