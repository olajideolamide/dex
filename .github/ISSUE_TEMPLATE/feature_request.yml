name: Feature request
description: Suggest an idea to improve DEX
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. DEX aims to stay simple and low-overhead, so context helps.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or pain point you're facing
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the simplest solution that would work for you
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered (optional)
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Issues (grouping/dedup/status)
        - Request lifecycle / tracing
        - Storage / retention / performance
        - UI / dashboard
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Screenshots, sample data shapes, constraints (traffic/volume), etc.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues and discussions
          required: true

