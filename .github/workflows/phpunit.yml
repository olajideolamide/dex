name: PHPUnit
run-name: "PHPUnit on ${{ github.ref_name }} (${{ github.event_name }})"

on:
  push:
    branches: ["main", "develop", "release/**"]
  pull_request:
    branches: ["main", "develop", "release/**"]

permissions:
  contents: read

jobs:
  phpunit-sqlite:
    name: "SQLite3 / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        dependencies: ["lowest", "highest"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: bash .github/scripts/install-dependencies.sh ${{ matrix.dependencies }}

      - name: Show resolved dependency versions
        run: |
          composer show codeigniter4/framework
          composer show phpunit/phpunit

      - name: Run tests
        run: composer test:sqlite

  phpunit-mysql:
    name: "MySQL 8 / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        dependencies: ["lowest", "highest"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dex_test
          MYSQL_ROOT_PASSWORD: ${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dex_test
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: bash .github/scripts/install-dependencies.sh ${{ matrix.dependencies }}

      - name: Show resolved dependency versions
        run: |
          composer show codeigniter4/framework
          composer show phpunit/phpunit

      - name: Run tests
        run: composer test:mysql

  phpunit-mariadb:
    name: "MariaDB 10.11 / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        dependencies: ["lowest", "highest"]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: dex_test
          MARIADB_ROOT_PASSWORD: ${{ github.run_id }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dex_test
      DB_USERNAME: root
      DB_PASSWORD: ${{ github.run_id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: bash .github/scripts/install-dependencies.sh ${{ matrix.dependencies }}

      - name: Show resolved dependency versions
        run: |
          composer show codeigniter4/framework
          composer show phpunit/phpunit

      - name: Run tests
        run: composer test:mysql

  phpunit-future-php:
    name: "SQLite3 / PHP 8.5 / advisory"
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: bash .github/scripts/install-dependencies.sh highest

      - name: Run tests
        run: composer test:sqlite
