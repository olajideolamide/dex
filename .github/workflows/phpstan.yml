name: PHPStan

on:
  push:
    branches: ["main", "develop", "release/**"]
  pull_request:
    branches: ["main", "develop", "release/**"]

permissions:
  contents: read

jobs:
  phpstan:
    name: "PHPStan / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"]
        dependencies: ["lowest", "highest"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: bash .github/scripts/install-dependencies.sh ${{ matrix.dependencies }}

      - name: Show resolved dependency versions
        run: composer show codeigniter4/framework

      - name: Run PHPStan
        run: composer phpstan
